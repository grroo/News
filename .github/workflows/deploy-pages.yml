name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: briefing-publication
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          rm -f _site/data/seen.json _site/data/feed-cache.json _site/data/section-cache.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site

      - uses: actions/deploy-pages@v4.0.5
        id: deployment
