name: Build briefing & deploy

on:
  schedule:
    # Rome time, including daylight saving changes. Always process a triggered
    # run even if GitHub starts it late; checking the runner's hour loses updates.
    - cron: "0 7,13,19 * * *"
      timezone: "Europe/Rome"
  push:
    branches: [main]
    paths: [config.yml, "scripts/**", "site/**", requirements.txt, .github/workflows/build.yml]
  workflow_dispatch:
    inputs:
      mock:
        description: "Skip the LLM (mock briefings)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mock }}" = "true" ]; then
            python scripts/build.py --mock
          else
            python scripts/build.py
          fi

      - name: Commit data
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "briefing: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          rm -f _site/data/seen.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
