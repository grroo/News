name: Build briefing & deploy

on:
  schedule:
    # Rome time, including daylight saving changes. Always process a triggered
    # run even if GitHub starts it late; checking the runner's hour loses updates.
    - cron: "0 7,13,19 * * *"
      timezone: "Europe/Rome"
  push:
    branches: [main]
    paths: [schedule.json, config.yml, "scripts/**", "site/**", "tests/**", requirements.txt, .github/workflows/build.yml]
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: "Publication slot (ISO timestamp; supplied by Cloudflare)"
        type: string
        required: false
      mock:
        description: "Skip the LLM (mock briefings)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Validate selection and freshness
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/freshness.test.cjs cloudflare/news-scheduler/core.test.mjs

      - name: Check scheduled slot
        id: slot
        env:
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
        run: python scripts/check_slot.py

      - name: Build briefing
        if: steps.slot.outputs.build == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mock }}" = "true" ]; then
            python scripts/build.py --mock
          else
            python scripts/build.py
          fi

      - name: Commit data
        if: steps.slot.outputs.build == 'true'
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "briefing: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      - name: Assemble site
        if: steps.slot.outputs.publish == 'true'
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          rm -f _site/data/seen.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.slot.outputs.publish == 'true'
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        if: steps.slot.outputs.publish == 'true'
        id: deployment
