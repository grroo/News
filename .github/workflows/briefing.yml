name: Briefing generation

on:
  schedule:
    # Rome time, including daylight saving changes. Remove only after Worker cutover
    # documented in docs/operations/scheduler-cutover.md.
    - cron: "0 7,13,19 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: "Publication slot (UTC ISO timestamp; Cloudflare supplies this for scheduled work)"
        type: string
        required: false
      reservation_id:
        description: "Opaque reservation id from the Worker gate"
        type: string
        required: false
      request_id:
        description: "Opaque request id acknowledged in the published edition"
        type: string
        required: false
      mock:
        description: "Explicit mock generation (never used by schedule)"
        type: boolean
        default: false
      deploy_only:
        description: "Publish committed data without fetching or generating"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing-publication
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime dependencies
        run: pip install -r requirements.lock

      - name: Check slot and generation guard
        id: slot
        env:
          SCHEDULED_SLOT: ${{ inputs.scheduled_slot }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RESERVATION_ID: ${{ inputs.reservation_id }}
          REQUEST_ID: ${{ inputs.request_id }}
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
          MOCK_REQUESTED: ${{ inputs.mock }}
          GENERATE_REQUESTED: ${{ inputs.deploy_only == false }}
          REQUIRE_RESERVATION: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_only == false && inputs.scheduled_slot == '' }}
          STRICT_SLOT_GATE: ${{ vars.STRICT_SLOT_GATE || 'false' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/check_slot.py

      - name: Claim reservation
        if: steps.slot.outputs.build == 'true' && inputs.reservation_id != ''
        env:
          RESERVATION_ID: ${{ inputs.reservation_id }}
          REQUEST_ID: ${{ inputs.request_id }}
          NEWS_RESERVATION_GATE_TOKEN: ${{ secrets.NEWS_RESERVATION_GATE_TOKEN }}
          RESERVATION_CLAIM_URL: ${{ vars.RESERVATION_CLAIM_URL }}
        run: python scripts/check_slot.py --claim

      - name: Build briefing
        if: steps.slot.outputs.build == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.mock }}" = "true" ]; then
            python scripts/build.py --mock
          else
            python scripts/build.py
          fi

      - name: Commit data
        if: steps.slot.outputs.build == 'true'
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "briefing: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      - name: Assemble site
        if: steps.slot.outputs.publish == 'true'
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          rm -f _site/data/seen.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3.0.1
        if: steps.slot.outputs.publish == 'true'
        with:
          path: _site

      - uses: actions/deploy-pages@v4.0.5
        if: steps.slot.outputs.publish == 'true'
        id: deployment
