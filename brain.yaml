name: News
# subset of ci.yml; PR CI is the gate (skips cloudflare/news-scheduler npm run check).
test: python3 -m unittest discover -s tests -p 'test_*.py' && node --test tests/freshness.test.cjs tests/contracts.test.cjs tests/frontend.test.cjs tests/release.test.cjs
run: null
# merging to main is the deploy (site/** via deploy-pages.yml; anything else at the next build.yml slot)
deploy: auto (on merge, deploy-pages.yml)
deploy_manual: gh workflow run deploy-pages.yml --repo grroo/News --ref main
# rollback placeholder: MERGE_PR = PR to undo; gh pr revert prints the revert PR URL, which gh pr merge accepts
rollback: gh pr merge "$(gh pr revert MERGE_PR --repo grroo/News)" --merge --repo grroo/News && gh workflow run deploy-pages.yml --repo grroo/News --ref main
rollback_one_command: true
default_branch: main
