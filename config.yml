    label: Zurich Insurance
  - symbol: SXR8.DE
    label: S&P 500 (iShares Core)
  - symbol: XDEW.DE
    label: S&P 500 Equal Weight (Xtrackers)
  - symbol: SPYY.DE
    label: MSCI ACWI (SPDR)
  - symbol: MEUD.PA
    label: Stoxx Europe 600 (Amundi)
  - symbol: AYEM.DE
    label: MSCI EM IMI (iShares)
  - symbol: GRID.DE
    label: Smart Grid (First Trust)
  - symbol: PPFB.DE
    label: PPFB
  - symbol: BTC-USD
    label: Bitcoin
  - symbol: ETH-USD
    label: Ethereum

market_news_sources:
  - name: Reuters Business (via Google News)
    url: https://news.google.com/rss/search?q=site:reuters.com+business&hl=en-US&gl=US&ceid=US:en
  - name: FT Markets (headlines only, via Google News)
    url: https://news.google.com/rss/search?q=site:ft.com+markets&hl=en-GB&gl=GB&ceid=GB:en
  - name: CNBC Markets
    url: https://www.cnbc.com/id/10000664/device/rss/rss.html
  - name: CoinDesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
  - name: Ethereum (via Google News)
    url: https://news.google.com/rss/search?q=Ethereum+OR+DeFi&hl=en-US&gl=US&ceid=US:en

