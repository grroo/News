# ── INTERESTS (free text, read by the LLM when ranking/selecting) ──────────
interests: |
  I'm French, living in Milan, and work in insurance on the insurer side
  (commercial lines, broker market, structured finance / SRT, investment
  portfolios). I read English, French and Italian. Write the briefing in
  English but feel free to pick French or Italian sources.

  For News: prioritise genuinely big stories — geopolitics, France, Italy,
  the EU, macro and central banks, markets-moving events — plus anything on
  AI (models, regulation, business impact), the insurance/reinsurance sector
  and Zurich Insurance. Skip celebrity, crime blotter, lifestyle and
  "explainer" pieces with no news in them.

  For Sport: Paris Saint-Germain first (matches, injuries, transfers, Ligue 1
  and Champions League), then the France national football team, then the
  Champions League generally, then the France rugby XV, then Counter-Strike 2
  (Team Vitality and major tournaments). Skip betting, gossip, and other
  clubs unless they play PSG or France.

  For Finance: what moved my holdings and why — global equities (S&P 500,
  MSCI ACWI, Europe 600, emerging markets, clean-energy/smart-grid ETFs),
  Zurich Insurance, and crypto (Bitcoin, Ethereum, DeFi). Rates, the ECB and
  Fed, credit, and the European insurance sector matter. Skip generic
  "5 stocks to buy", price-prediction clickbait and memecoin news.
