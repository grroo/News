<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<title>Briefing</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f1115'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='%23e6e6e6' font-family='sans-serif'>B</text></svg>">
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #17181b; --muted: #6b6f76; --line: #e3e3df;
    --accent: #2f6fed; --up: #1f9d55; --down: #d64545; --new: #e8541e;
    --news: #2f6fed; --sport: #1f9d55; --finance: #b8860b; --media: #a34ccf;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1115; --card: #181b21; --ink: #e8e8e6; --muted: #8b9098; --line: #262a32;
    --accent: #7aa2ff; --up: #4fd18b; --down: #ff6b6b; --new: #ff8a4c;
    --news: #7aa2ff; --sport: #4fd18b; --finance: #e6b84a; --media: #c98cf0;
  }}
  :root[data-theme="dark"] {
    --bg: #0f1115; --card: #181b21; --ink: #e8e8e6; --muted: #8b9098; --line: #262a32;
    --accent: #7aa2ff; --up: #4fd18b; --down: #ff6b6b; --new: #ff8a4c;
    --news: #7aa2ff; --sport: #4fd18b; --finance: #e6b84a; --media: #c98cf0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header h1 a { display: inline-flex; align-items: center; gap: 8px; }
  .meta { font-size: 13px; color: var(--muted); }
  .btn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px;
    padding: 6px 10px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn:hover { color: var(--ink); border-color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* landing */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { aspect-ratio: 1; border-radius: 18px; background: var(--card); border: 1px solid var(--line);
    padding: 18px; display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden; transition: transform .08s ease; }
  .tile:active { transform: scale(.98); }
  .tile::before { content: ""; position: absolute; inset: 0 auto auto 0; height: 4px; width: 100%; background: var(--c); }
  .tile .name { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .tile .count { font-size: 13px; color: var(--muted); }
  .tile .count b { color: var(--new); font-weight: 600; }
  .tile .count.zero b { color: var(--muted); }
  @media (min-width: 560px) { .tile .name { font-size: 30px; } }
  /* phones: the four tiles fill the screen instead of sitting in the top half */
  @media (max-width: 559px) {
    .landing { display: flex; flex-direction: column; min-height: calc(100dvh - 32px - env(safe-area-inset-bottom)); }
    .landing .grid { flex: 1; grid-template-rows: 1fr 1fr; gap: 14px; }
    .tile { aspect-ratio: auto; min-height: 150px; padding: 20px; }
    .tile .name { font-size: 30px; }
    .tile .count { font-size: 14px; }
  }

  /* section */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 0 10px; }
  .section-head h2 { font-size: 26px; margin: 0; letter-spacing: -0.02em; border-bottom: 3px solid var(--c); }
  .brief { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    margin-bottom: 14px; font-size: 16px; line-height: 1.55; }
  .brief.mock { border-style: dashed; color: var(--muted); font-size: 14px; }
  .brief ul { margin: 0; padding-left: 1.15em; }
  .brief li { margin: 0 0 8px; }
  .brief li:last-child { margin-bottom: 0; }
  .brief li::marker { color: var(--c); }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; position: relative; }
  .card.seen { opacity: .62; }
  .card .t { font-weight: 600; line-height: 1.35; margin: 0 0 4px; padding-right: 14px; }
  .card .s { font-size: 14px; color: var(--ink); opacity: .85; margin: 0 0 6px; }
  .card .m { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
  .card .m .kind { text-transform: uppercase; letter-spacing: .04em; font-size: 11px; }
  .card .dot { position: absolute; top: 14px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--new); }
  .card.seen .dot { display: none; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }

  /* tickers */
  table.tick { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; margin-bottom: 14px; font-size: 14px; }
  table.tick td { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  table.tick tr:last-child td { border-bottom: 0; }
  table.tick td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .up { color: var(--up); } .down { color: var(--down); }
  .sym { color: var(--muted); font-size: 12px; margin-left: 6px; }

  /* past */
  .past a { display: block; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .past a small { color: var(--muted); display: block; }
  .banner { background: var(--card); border: 1px dashed var(--line); color: var(--muted); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
  footer { margin-top: 28px; font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<main id="app"><div class="empty">Loading…</div></main>

<script>
(() => {
  'use strict';
  const $app = document.getElementById('app');
  const SECTIONS = ['news', 'sport', 'finance', 'media'];
  const LABELS = { news: 'News', sport: 'Sport', finance: 'Finance', media: 'Media' };
  const LS_SEEN = 'briefing.seen.v1', LS_THEME = 'briefing.theme';

  // ── seen state (localStorage only) ─────────────────────────────────────
  const seen = new Set(JSON.parse(localStorage.getItem(LS_SEEN) || '[]'));
  const saveSeen = () => localStorage.setItem(LS_SEEN, JSON.stringify([...seen].slice(-2000)));
  const markSeen = k => { if (k && !seen.has(k)) { seen.add(k); saveSeen(); } };

  // ── theme ──────────────────────────────────────────────────────────────
  const applyTheme = () => {
    const t = localStorage.getItem(LS_THEME);
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  };
  const toggleTheme = () => {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const cur = localStorage.getItem(LS_THEME) || (dark ? 'dark' : 'light');
    localStorage.setItem(LS_THEME, cur === 'dark' ? 'light' : 'dark');
    applyTheme();
  };
  applyTheme();

  // ── data ───────────────────────────────────────────────────────────────
  let current = null, viewing = null, pastIndex = null, shown = null;
  const fetchJSON = async p => { const r = await fetch(p + '?t=' + Math.floor(Date.now() / 60000)); if (!r.ok) throw new Error(r.status + ' ' + p); return r.json(); };
  const loadCurrent = async () => current || (current = await fetchJSON('data/briefing.json'));
  const loadPastIndex = async () => pastIndex || (pastIndex = await fetchJSON('data/past/index.json').catch(() => []));

  // ── helpers ────────────────────────────────────────────────────────────
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ago = iso => {
    if (!iso) return '';
    const d = (Date.now() - new Date(iso)) / 60000;
    if (d < 1) return 'now'; if (d < 60) return Math.round(d) + 'm';
    if (d < 36 * 60) return Math.round(d / 60) + 'h';
    return Math.round(d / 1440) + 'd';
  };
  const dur = s => s ? (s >= 3600 ? Math.floor(s / 3600) + 'h ' + Math.round((s % 3600) / 60) + 'm' : Math.round(s / 60) + 'm') : '';
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
  const unseenCount = sec => (sec?.items || []).filter(i => !seen.has(i.key)).length;
  const fmtLocal = b => b.generated_local || new Date(b.generated_at).toLocaleString();

  const headerHTML = (b, sub) => `
    <header>
      <h1><a href="#/">Briefing</a></h1>
      <div class="row">
        <span class="meta">${esc(sub ?? ('updated ' + fmtLocal(b)))}</span>
        <button class="btn" data-theme-toggle title="Toggle dark mode">◐</button>
      </div>
    </header>`;

  // ── views ──────────────────────────────────────────────────────────────
  const landing = b => `<div class="landing">
    ${headerHTML(b)}
    ${b !== current ? `<div class="banner">Viewing a past briefing from ${esc(fmtLocal(b))}. <a href="#/" style="color:var(--accent)">Back to latest</a></div>` : ''}
    <div class="grid">
      ${SECTIONS.map(s => {
        const sec = b.sections[s] || { items: [] }, n = unseenCount(sec);
        const path = b === current ? `#/${s}` : `#/past/${encodeURIComponent(viewing)}/${s}`;
        return `<a class="tile" style="--c:var(--${s})" href="${path}">
          <div class="name">${LABELS[s]}</div>
          <div class="count ${n ? '' : 'zero'}"><b>${n}</b> new · ${sec.items.length} items</div>
        </a>`;
      }).join('')}
    </div>
    <footer>
      <span><a href="#/past">Past briefings</a></span>
      <span>${b.mode === 'mock' ? 'mock mode · ' : ''}3×/day · ${esc(b.timezone || '')}</span>
    </footer></div>`;

  const card = it => `
    <a class="card ${seen.has(it.key) ? 'seen' : ''}" href="${esc(it.url)}" target="_blank" rel="noopener" data-key="${esc(it.key)}">
      <span class="dot"></span>
      <p class="t">${esc(it.title)}</p>
      ${it.summary ? `<p class="s">${esc(it.summary)}</p>` : ''}
      <p class="m">${it.kind ? `<span class="kind">${esc(it.kind)}</span>` : ''}<span>${esc(it.source)}</span><span>·</span><span>${ago(it.published)}</span>${it.duration_s ? `<span>·</span><span>${dur(it.duration_s)}</span>` : ''}${host(it.url) && host(it.url) !== it.source ? `<span>·</span><span>${esc(host(it.url))}</span>` : ''}</p>
    </a>`;

  const briefHTML = (br, mock, s) => {
    if (!br || (Array.isArray(br) && !br.length)) return '';
    const body = Array.isArray(br) ? `<ul>${br.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : esc(br);
    return `<div class="brief ${mock ? 'mock' : ''}" style="--c:var(--${s})">${body}</div>`;
  };

  const tickers = rows => rows?.length ? `
    <table class="tick"><tbody>${rows.map(r => {
      const p = r.change_pct, cls = p == null ? '' : p >= 0 ? 'up' : 'down';
      return `<tr><td>${esc(r.label)}<span class="sym">${esc(r.symbol)}</span></td>
        <td class="num">${r.price != null ? r.price.toLocaleString(undefined, { maximumFractionDigits: 2 }) : '—'}${r.currency ? ` <span class="sym">${esc(r.currency)}</span>` : ''}</td>
        <td class="num ${cls}">${p == null ? '—' : (p > 0 ? '+' : '') + p.toFixed(2) + '%'}</td></tr>`;
    }).join('')}</tbody></table>` : '';

  const section = (b, s) => {
    const sec = b.sections[s] || { items: [] };
    const backPath = b === current ? '#/' : `#/past/${encodeURIComponent(viewing)}`;
    return `
      ${headerHTML(b)}
      <div class="section-head" style="--c:var(--${s})">
        <h2>${LABELS[s]}</h2>
        <div class="row"><a class="btn" href="${backPath}">← Home</a><button class="btn" data-mark-all="${s}">Mark all read</button></div>
      </div>
      ${s === 'finance' ? tickers(sec.tickers) : ''}
      ${briefHTML(sec.briefing, b.mode === 'mock', s)}
      <div class="cards">${sec.items.length ? sec.items.map(card).join('') : '<div class="empty">Nothing new in this window.</div>'}</div>
      <footer><span>${sec.candidate_count ?? sec.items.length} candidates considered</span><span><a href="#/past">Past briefings</a></span></footer>`;
  };

  const past = (b, idx) => `
    ${headerHTML(b, 'past briefings')}
    <div class="past">
      <a href="#/"><b>Latest</b><small>${esc(fmtLocal(b))}</small></a>
      ${idx.length ? idx.map(p => `<a href="#/past/${encodeURIComponent(p.file)}">${esc(new Date(p.generated_at).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}
        <small>${SECTIONS.map(s => `${LABELS[s]} ${p.counts?.[s] ?? 0}`).join(' · ')}</small></a>`).join('')
        : '<div class="empty">No past briefings yet.</div>'}
    </div>`;

  // ── router ─────────────────────────────────────────────────────────────
  const render = async () => {
    try {
      const b = await loadCurrent();
      const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
      if (parts[0] === 'past') {
        if (!parts[1]) { $app.innerHTML = past(b, await loadPastIndex()); }
        else {
          viewing = parts[1];
          const pb = await fetchJSON('data/past/' + encodeURIComponent(parts[1]));
          shown = pb; $app.innerHTML = SECTIONS.includes(parts[2]) ? section(pb, parts[2]) : landing(pb);
        }
      } else if (SECTIONS.includes(parts[0])) {
        viewing = null; shown = b; $app.innerHTML = section(b, parts[0]);
      } else {
        viewing = null; shown = b; $app.innerHTML = landing(b);
      }
      window.scrollTo(0, 0);
    } catch (e) {
      $app.innerHTML = `<div class="empty">Could not load the briefing (${esc(e.message)}).<br><small>Has the build workflow run yet?</small></div>`;
    }
  };

  $app.addEventListener('click', e => {
    const c = e.target.closest('.card'); if (c) { markSeen(c.dataset.key); c.classList.add('seen'); return; }
    const m = e.target.closest('[data-mark-all]');
    if (m) { const sec = shown?.sections?.[m.dataset.markAll];
      (sec?.items || []).forEach(i => markSeen(i.key)); render(); return; }
    if (e.target.closest('[data-theme-toggle]')) toggleTheme();
  });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
